{% set name = "jupyterlab-git" %}
{% set version = "0.54.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name.replace('-','_')}}/{{ name.replace('-','_')}}-{{ version }}.tar.gz
  sha256: 4d0b46d3d17376a5c610633a2191868f577f46341e112dc9dece1f501cd46b65

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling >=1.5.0
    - hatch-nodejs-version >=0.3.2
  run:
    - python
    # jupyterlab-git-core[nbdime]>=0.52.0
    - jupyterlab-git-core >=0.52.0
    # https://inspector.pypi.io/project/jupyterlab-git-core/0.54.0/packages/84/76/53411bedeeba5d339fb197384a9a3f9ddd9de2adef76df97aeca0da2ed78/jupyterlab_git_core-0.54.0.tar.gz/jupyterlab_git_core-0.54.0/pyproject.toml#line.37
    - nbdime >=4.0.1,<4.1.0
    - jupyter_server >=2.0.1,<3
    - traitlets >=5.0,<6.0

test:
  imports:
    - jupyterlab_git
  commands:
    - pip check
    - jupyter server extension list
    - jupyter server extension list 2>&1 | grep -ie "jupyterlab_git.*OK"      # [not win]
    - jupyter server extension list 2>&1 | findstr /i /r "jupyterlab_git.*OK"  # [win]
    - jupyter labextension list
    - jupyter labextension list 2>&1 | grep -ie "@jupyterlab/git.*OK.*(python, jupyterlab-git-core)"      # [not win]
    - jupyter labextension list 2>&1 | findstr /i /r "@jupyterlab/git.*OK.*(python,.*jupyterlab-git-core)"  # [win]
  requires:
    - pip
    - jupyterlab >=4.0.0,<5

about:
  home: https://github.com/jupyterlab/jupyterlab-git
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A Git extension for JupyterLab
  description: A JupyterLab extension for version control using git
  dev_url: https://github.com/jupyterlab/jupyterlab-git
  doc_url: https://github.com/jupyterlab/jupyterlab-git

extra:
  recipe-maintainers:
    - dbast
    - blink1073
    - fcollonval
